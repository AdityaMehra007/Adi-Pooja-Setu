<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sacred Geography & Tirtha Yatra Atlas</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: serif;
      background: #FFFBF5;
      color: #2C1810;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: #4A0E17;
      color: #FFFBF5;
      padding: 10px 14px;
      border-bottom: 2px solid #D4AF37;
      z-index: 1001;
    }
    .header-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .title-group h1 {
      font-size: 1.1rem;
      color: #FFFBF5;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .title-group h1 span.om { color: #D4AF37; font-size: 1.25rem; }
    .filter-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .filter-btn {
      background: rgba(255,255,255,0.15);
      color: #FFFBF5;
      border: 1px solid rgba(212,175,55,0.5);
      padding: 4px 10px;
      border-radius: 16px;
      font-size: 0.72rem;
      cursor: pointer;
      font-weight: bold;
      white-space: nowrap;
    }
    .filter-btn.active {
      background: #D4AF37;
      color: #4A0E17;
    }
    .filter-btn.active.shakti {
      background: #C2185B;
      color: #FFFBF5;
      border-color: #FF80AB;
    }
    .search-row {
      margin-top: 6px;
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .search-input {
      flex: 1;
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid rgba(212,175,55,0.6);
      background: rgba(255,255,255,0.2);
      color: #FFFBF5;
      font-size: 0.75rem;
    }
    .search-input::placeholder { color: rgba(255,255,255,0.7); }
    #map { flex: 1; width: 100%; height: 100%; }

    .detail-card {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      max-height: 52%;
      background: #FFFBF5;
      border: 2px solid #D4AF37;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      padding: 12px 14px;
      overflow-y: auto;
      z-index: 1000;
      display: none;
    }
    .detail-card .badge {
      font-size: 0.65rem;
      font-weight: bold;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .badge-jyo { background: #FFF8E1; color: #B78103; border: 1px solid #FFE082; }
    .badge-sp { background: #FCE4EC; color: #AD1457; border: 1px solid #F48FB1; }
    .close-btn {
      float: right;
      background: none;
      border: none;
      font-size: 1.1rem;
      font-weight: bold;
      color: #888;
    }
    .detail-title { font-size: 1.05rem; color: #4A0E17; font-weight: bold; margin-top: 2px; }
    .detail-loc { font-size: 0.75rem; color: #666; margin-bottom: 6px; }
    .detail-field { margin-bottom: 6px; font-size: 0.78rem; line-height: 1.3; }
    .detail-field strong { color: #4A0E17; display: block; font-size: 0.72rem; text-transform: uppercase; }
    .mantra-box {
      background: #4A0E17;
      color: #FFFBF5;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.78rem;
      margin-top: 6px;
    }
    .mantra-label { font-size: 0.65rem; color: #D4AF37; text-transform: uppercase; font-weight: bold; display: block; }
    .sacred-marker-icon { position: relative; width: 28px; height: 28px; }
    .sacred-pin {
      width: 26px;
      height: 26px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .pin-jyo { background: #D4AF37; border: 2px solid #4A0E17; }
    .pin-sp { background: #C2185B; border: 2px solid #FFFBF5; }
    .pin-symbol { transform: rotate(45deg); font-size: 12px; }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <div class="title-group">
        <h1><span class="om">ॐ</span> Tirtha Yatra Sacred Atlas</h1>
      </div>
      <div class="filter-bar">
        <button id="btn-geo" class="filter-btn" style="background:#D4AF37; color:#4A0E17; font-weight:bold;" onclick="findClosestTirthas()">📍 3 Closest</button>
        <button id="btn-all" class="filter-btn active" onclick="setFilter('ALL')">All (63)</button>
        <button id="btn-jyo" class="filter-btn" onclick="setFilter('JYOTIRLINGA')">🔱 12 Jyotirlingas</button>
        <button id="btn-sp" class="filter-btn shakti" onclick="setFilter('SHAKTI_PEETHA')">🌺 51 Shakti Peethas</button>
      </div>
    </div>
    <div class="search-row">
      <input type="text" id="searchInput" class="search-input" placeholder="Search temple, state, deity (e.g. Somnath, Assam)..." oninput="handleSearch(this.value)" />
      <span id="siteCount" style="font-size: 0.7rem; color: #D4AF37; white-space: nowrap;">63 sites</span>
    </div>
  </header>

  <div id="map"></div>

  <!-- Closest Tirthas Result Modal -->
  <div id="closestModal" class="detail-card" style="max-height: 60%; border-color: #D4AF37;">
    <button class="close-btn" onclick="closeClosestModal()">✕</button>
    <span class="badge" style="background:#FFF8E1; color:#B78103; border:1px solid #FFE082;">📍 Nearest Pilgrimage Sites</span>
    <h2 class="detail-title">3 Closest Sacred Tirthas</h2>
    <div id="closestGpsInfo" class="detail-loc"></div>
    <div id="closestList" style="display:flex; flex-direction:column; gap:8px; margin-top:6px;"></div>
  </div>

  <div id="detailCard" class="detail-card">
    <button class="close-btn" onclick="closeDetailCard()">✕</button>
    <span id="detailBadge" class="badge"></span>
    <h2 id="detailTitle" class="detail-title"></h2>
    <div id="detailLoc" class="detail-loc"></div>
    <div class="detail-field"><strong>Presiding Deity</strong><span id="detailDeity"></span></div>
    <div id="detailSignificanceBox" class="detail-field" style="background:#FFF8E1; padding:4px 6px; border-radius:4px;">
      <strong style="color:#B78103;">Significance</strong>
      <span id="detailSignificance"></span>
    </div>
    <div class="detail-field">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2px;">
        <strong>Sthala Purana</strong>
        <button id="audioTourBtn" style="background:#4A0E17; color:#FFFBF5; border:1px solid #D4AF37; border-radius:12px; padding:2px 8px; font-size:0.68rem; cursor:pointer;" onclick="toggleAudioTour()">
          <span id="audioTourIcon">🔊</span> <span id="audioTourText">Audio Tour</span>
        </button>
      </div>
      <span id="detailPurana"></span>
    </div>
    <div class="detail-field"><strong>Scriptural Authority</strong><span id="detailSource" style="font-style:italic;"></span></div>
    <div class="mantra-box">
      <span class="mantra-label">Chanting</span>
      <span id="detailMantra"></span>
    </div>
  </div>

    function getMarkerIcon(cat) {
      const isJyo = cat === 'JYOTIRLINGA';
      return L.divIcon({
        className: 'sacred-marker-icon',
        html: `<div class="sacred-pin ${isJyo?'pin-jyo':'pin-sp'}"><div class="pin-symbol">${isJyo?'🔱':'🌺'}</div></div>`,
        iconSize: [26, 26],
        iconAnchor: [13, 26],
        popupAnchor: [0, -26]
      });
    }

    let markers = [];
    let currentFilter = 'ALL';
    let searchQuery = '';

    function renderMarkers() {
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      const filtered = TIRTHAS.filter(t => {
        const matchesCategory = currentFilter === 'ALL' || t.cat === currentFilter;
        const q = searchQuery.toLowerCase().trim();
        const matchesSearch = !q ||
          t.name.toLowerCase().includes(q) ||
          t.state.toLowerCase().includes(q) ||
          t.loc.toLowerCase().includes(q) ||
          t.deity.toLowerCase().includes(q);
        return matchesCategory && matchesSearch;
      });

      document.getElementById('siteCount').innerText = `${filtered.length} sites`;

      filtered.forEach(t => {
        const marker = L.marker([t.lat, t.lng], { icon: getMarkerIcon(t.cat) });
        marker.on('click', () => showDetail(t.id));
        marker.addTo(map);
        markers.push(marker);
      });
    }

    function setFilter(cat) {
      currentFilter = cat;
      document.getElementById('btn-all').classList.toggle('active', cat === 'ALL');
      document.getElementById('btn-jyo').classList.toggle('active', cat === 'JYOTIRLINGA');
      document.getElementById('btn-sp').classList.toggle('active', cat === 'SHAKTI_PEETHA');
      renderMarkers();
    }

    function handleSearch(val) {
      searchQuery = val;
      renderMarkers();
    }

    function showDetail(id) {
      const t = TIRTHAS.find(item => item.id === id);
      if (!t) return;

      activeDetailTirtha = t;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      resetAudioBtn();

      const isJyo = t.cat === 'JYOTIRLINGA';
      document.getElementById('detailBadge').innerText = isJyo ? '🔱 12 Jyotirlinga' : '🌺 51 Shakti Peetha';
      document.getElementById('detailBadge').className = 'badge ' + (isJyo ? 'badge-jyo' : 'badge-sp');
      document.getElementById('detailTitle').innerText = t.name;
      document.getElementById('detailLoc').innerText = `📍 ${t.loc}, ${t.state}`;
      document.getElementById('detailDeity').innerText = t.deity;
      document.getElementById('detailSignificance').innerText = t.sig;
      document.getElementById('detailPurana').innerText = t.purana;
      document.getElementById('detailSource').innerText = t.source;
      document.getElementById('detailMantra').innerText = t.mantra;
      document.getElementById('detailCard').style.display = 'block';

      map.flyTo([t.lat, t.lng], 8, { duration: 1.0 });
    }

    let activeDetailTirtha = null;

    function closeDetailCard() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      resetAudioBtn();
      activeDetailTirtha = null;
      document.getElementById('detailCard').style.display = 'none';
    }

    function toggleAudioTour() {
      if (!('speechSynthesis' in window)) {
        alert("Speech synthesis is not supported on this browser.");
        return;
      }
      const synth = window.speechSynthesis;
      if (synth.speaking) {
        synth.cancel();
        resetAudioBtn();
        return;
      }
      if (!activeDetailTirtha) return;

      const btn = document.getElementById('audioTourBtn');
      const icon = document.getElementById('audioTourIcon');
      const text = document.getElementById('audioTourText');

      const narrative = `Sacred Tirtha: ${activeDetailTirtha.name}, located in ${activeDetailTirtha.loc}, ${activeDetailTirtha.state}. Presiding deity: ${activeDetailTirtha.deity}. Sthala Purana history: ${activeDetailTirtha.purana}. Canonical source: ${activeDetailTirtha.source}. Sacred mantra: ${activeDetailTirtha.mantra}.`;

      const utter = new SpeechSynthesisUtterance(narrative);
      utter.rate = 0.92;
      utter.onstart = () => {
        if (icon) icon.innerText = '⏹️';
        if (text) text.innerText = 'Stop';
      };
      utter.onend = () => resetAudioBtn();
      utter.onerror = () => resetAudioBtn();
      synth.speak(utter);
    }

    function resetAudioBtn() {
      const icon = document.getElementById('audioTourIcon');
      const text = document.getElementById('audioTourText');
      if (icon) icon.innerText = '🔊';
      if (text) text.innerText = 'Audio Tour';
    }

    function closeClosestModal() {
      document.getElementById('closestModal').style.display = 'none';
    }

    function getDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return Math.round(R * c * 10) / 10;
    }

    let userGpsMarker = null;

    function findClosestTirthas() {
      const btn = document.getElementById('btn-geo');
      if (!navigator.geolocation) {
        alert("Geolocation is not supported by your device browser.");
        return;
      }

      btn.innerText = "⏳...";
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          btn.innerText = "📍 3 Closest";
          const uLat = pos.coords.latitude;
          const uLng = pos.coords.longitude;

          if (userGpsMarker) map.removeLayer(userGpsMarker);
          const userIcon = L.divIcon({
            className: 'user-marker',
            html: `<div style="width:20px;height:20px;border-radius:50%;background:#1E88E5;border:3px solid #FFF;box-shadow:0 0 10px rgba(30,136,229,0.9);"></div>`,
            iconSize: [20, 20],
            iconAnchor: [10, 10]
          });
          userGpsMarker = L.marker([uLat, uLng], { icon: userIcon }).addTo(map).bindPopup("<b>📍 Your Position</b>").openPopup();

          const withDist = TIRTHAS.map(t => ({
            ...t,
            distanceKm: getDistanceKm(uLat, uLng, t.lat, t.lng)
          })).sort((a,b) => a.distanceKm - b.distanceKm);

          const top3 = withDist.slice(0, 3);
          document.getElementById('closestGpsInfo').innerText = `Location: ${uLat.toFixed(2)}° N, ${uLng.toFixed(2)}° E`;

          const listContainer = document.getElementById('closestList');
          listContainer.innerHTML = '';

          top3.forEach((item, index) => {
            const card = document.createElement('div');
            card.style.cssText = 'background:#FFF; padding:8px; border-radius:6px; border:1px solid #E0D7C6;';
            card.innerHTML = `
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <strong style="color:#4A0E17; font-size:0.85rem;">${index + 1}. ${item.name}</strong>
                <span style="font-size:0.7rem; font-weight:bold; color:#B78103; background:#FFF8E1; padding:2px 4px; border-radius:3px;">
                  ${item.distanceKm} km
                </span>
              </div>
              <div style="font-size:0.72rem; color:#666;">📍 ${item.loc}, ${item.state}</div>
              <div style="font-size:0.72rem; color:#333;"><strong>Deity:</strong> ${item.deity}</div>
              <button onclick="showDetail('${item.id}')" style="margin-top:4px; width:100%; background:#4A0E17; color:#FFFBF5; border:none; padding:3px 6px; border-radius:4px; font-size:0.7rem; cursor:pointer;">
                Inspect Details →
              </button>
            `;
            listContainer.appendChild(card);
          });

          document.getElementById('closestModal').style.display = 'block';
          map.flyTo([top3[0].lat, top3[0].lng], 7, { duration: 1.0 });
        },
        (err) => {
          btn.innerText = "📍 3 Closest";
          alert("GPS Location Error: " + (err.message || "Permission denied"));
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    renderMarkers();
  </script>
